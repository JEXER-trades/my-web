<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JXSTUDIO — We create what's next</title>
    <meta name="description" content="JXSTUDIO helps ambitious businesses transform ideas into meaningful brands, digital experiences, and opportunities." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JXSTUDIO" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>
      <div style="padding:2rem;font-family:system-ui">JXSTUDIO — Creative vision. Strategic thinking. Digital excellence. Please enable JavaScript to view this site.</div>
    </noscript>
    <div id="root"></div>
    <!-- Static copy of the inquiry form so Netlify detects it at deploy time. Keep fields in sync with src/lib/inquiry.ts. -->
    <form name="inquiry" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="hidden" name="form-name" value="inquiry" />
      <input name="subject" /><input name="name" /><input name="email" /><input name="company" />
      <input name="service" /><textarea name="message"></textarea><input name="budget" />
      <input name="consent" /><input name="website" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
